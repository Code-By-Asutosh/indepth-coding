@if (category(); as cat) {
  <!-- Floating reopen FAB when sidebar is collapsed on desktop -->
  @if (sidebarCollapsed()) {
    <button
      type="button"
      (click)="openSidebar()"
      class="sb-open-fab"
      title="Open sidebar"
      aria-label="Open sidebar"
    >
      »
    </button>
  }

  <!-- Mobile/tablet topbar: only shown below the lg breakpoint, where the sidebar is hidden -->
  <div class="sticky top-[57px] z-30 flex items-center gap-3 border-b border-[var(--color-border)] bg-[var(--color-bg)]/85 px-4 py-2.5 backdrop-blur-lg lg:hidden">
    <button
      type="button"
      (click)="toggleMobileNav()"
      class="sb-toggle"
      aria-label="Open topic navigation"
    >
      ☰
    </button>
    <span class="truncate font-mono text-xs font-semibold text-[var(--color-text)]">{{ cat.icon }} {{ cat.title }}</span>
  </div>

  <!-- Mobile/tablet drawer -->
  @if (mobileNavOpen()) {
    <div class="fixed inset-0 z-50 lg:hidden">
      <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" (click)="closeMobileNav()"></div>
      <aside class="absolute inset-y-0 left-0 w-[85%] max-w-xs overflow-y-auto border-r border-[var(--color-border)] bg-[var(--color-bg-raised)] shadow-2xl">
        <app-side-nav [category]="cat" [activeTopicId]="activeTopicId()" (collapse)="closeMobileNav()" />
      </aside>
    </div>
  }

  <!-- Full-bleed app shell: Sidebar (300px) | Content (1fr) -->
  <div class="flex min-h-[calc(100vh-3.5rem)] w-full transition-all duration-300">
    @if (!sidebarCollapsed()) {
      <aside class="hidden w-[300px] shrink-0 border-r border-[var(--color-border)] bg-[var(--color-bg-raised)] lg:block">
        <div class="sticky top-[57px] h-[calc(100vh-3.5rem)] overflow-y-auto">
          <app-side-nav [category]="cat" [activeTopicId]="activeTopicId()" (collapse)="collapseSidebar()" />
        </div>
      </aside>
    }

    <!-- Content page ALWAYS remains open and fills the available area -->
    <main class="min-w-0 flex-1">
      <router-outlet />
    </main>
  </div>
} @else {
  <div class="mx-auto max-w-2xl px-6 py-24 text-center">
    <p class="text-2xl font-bold text-[var(--color-text)]">Category not found</p>
    <a routerLink="/" class="mt-4 inline-block text-[var(--color-brand-400)] hover:underline">← Back home</a>
  </div>
}
