<header class="sticky top-0 z-40 border-b border-[var(--color-border)] bg-[color-mix(in_srgb,var(--color-bg)_72%,transparent)] backdrop-blur-xl">
  <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-6 py-3">
    <a routerLink="/" class="group flex items-center gap-2.5" aria-label="Indepth Coding home">
      <span
        class="flex h-9 w-9 items-center justify-center rounded-lg bg-gradient-to-br from-[var(--color-brand-400)] to-[var(--color-brand-700)] text-sm font-black text-[#171207] shadow-[0_4px_16px_-6px_rgba(194,148,47,0.7)] transition group-hover:scale-105"
      >
        &lt;/&gt;
      </span>
      <span class="font-mono text-base font-bold leading-none tracking-tight text-[var(--color-text)]">
        indepth-coding<span class="text-[var(--color-brand-400)]">~/lab</span>
      </span>
    </a>

    <nav class="hidden items-center gap-1 md:flex" aria-label="Primary">
      <a
        routerLink="/learn/interview-prep"
        class="rounded-md px-3 py-1.5 font-mono text-xs tracking-wide text-[var(--color-text-muted)] transition hover:bg-[var(--color-surface)] hover:text-[var(--color-text)]"
      >
        <span class="text-[var(--color-brand-500)]">01</span> learn
      </a>
      <a
        routerLink="/practice"
        class="rounded-md px-3 py-1.5 font-mono text-xs tracking-wide text-[var(--color-text-muted)] transition hover:bg-[var(--color-surface)] hover:text-[var(--color-text)]"
      >
        <span class="text-[var(--color-brand-500)]">02</span> practice
      </a>
      <!-- Compact learning stats (level · XP · streak) land here in the dashboard phase. -->
    </nav>

    @if (session.hasName()) {
      <div class="flex items-center gap-2.5">
        <span
          class="flex h-9 w-9 items-center justify-center rounded-full border border-[var(--color-border-strong)] bg-gradient-to-br from-[var(--color-brand-400)] to-[var(--color-brand-700)] text-sm font-bold text-[#171207]"
          aria-hidden="true"
        >
          {{ initial() }}
        </span>
        <span class="hidden font-mono text-xs text-[var(--color-text-muted)] sm:inline">{{ session.name() }}</span>
      </div>
    }
  </div>
</header>
