<figure class="term-window my-6">
  <div class="term-window__bar">
    <span class="term-dots"><i class="term-dot"></i><i class="term-dot"></i><i class="term-dot"></i></span>
    diagram — {{ definition().variant }}
  </div>

  <div class="px-4 py-5 sm:px-6" role="img" [attr.aria-label]="ariaLabel()">
    @if (asFlow(); as flow) {
      <app-diagram-flow [nodes]="flow.nodes" [edges]="flow.edges" [direction]="flow.direction ?? 'lr'" />
    } @else if (asStack(); as stack) {
      <app-diagram-stack [layers]="stack.layers" />
    } @else if (asHub(); as hub) {
      <app-diagram-hub [hub]="hub.hub" [spokes]="hub.spokes" />
    } @else if (asSplit(); as split) {
      <app-diagram-split [left]="split.left" [right]="split.right" [verdict]="split.verdict" />
    } @else if (asTimeline(); as timeline) {
      <app-diagram-timeline [steps]="timeline.steps" />
    }
  </div>

  @if (caption()) {
    <figcaption
      class="border-t border-[var(--color-border)] px-4 py-2.5 font-mono text-[11px] leading-relaxed text-[var(--color-text-muted)] sm:px-6"
    >
      <span class="text-[var(--color-brand-400)]">//</span>
      {{ caption() }}
    </figcaption>
  }
</figure>
